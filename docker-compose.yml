services:
  nginx:
    image: nginx:alpine
    container_name: parcial_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    command:
      - sh
      - -c
      - rm -f /var/log/nginx/access.log /var/log/nginx/error.log && exec nginx -g 'daemon off;'
    depends_on:
      - joomla
      - jupyter
      - grafana
    networks:
      - frontend_net
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    container_name: parcial_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/01-traffic.sql:/docker-entrypoint-initdb.d/01-traffic.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend_net
    restart: unless-stopped

  joomla:
    image: joomla:latest
    container_name: parcial_joomla
    environment:
      JOOMLA_DB_TYPE: ${JOOMLA_DB_TYPE}
      JOOMLA_DB_HOST: database
      JOOMLA_DB_PORT: 5432
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME}
      JOOMLA_DB_USER: ${JOOMLA_DB_USER}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD}
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL}
    volumes:
      - joomla_data:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped

  jupyter:
    build:
      context: ./jupyter
    container_name: parcial_jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
      - ./scripts/collect_logs.py:/home/jovyan/collect_logs.py:ro
      - nginx_logs:/var/log/nginx:ro
    command:
      - bash
      - -lc
      - |
        python /home/jovyan/collect_logs.py &
        exec start-notebook.py --ServerApp.base_url=/jupyter/ --ServerApp.token="$${JUPYTER_TOKEN}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: parcial_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  joomla_data:
  grafana_data:
  nginx_logs: